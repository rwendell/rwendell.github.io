name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up aube and Node
        uses: jdx/aube-action@v1
        with:
          node-version: "22"
          run-install: true

      - name: Check
        run: aube run check

      - name: Build
        run: aube run build
