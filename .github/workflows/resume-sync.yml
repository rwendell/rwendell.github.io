name: Sync Resume

on:
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the resume even if the source hash is unchanged
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: resume-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_REBUILD: ${{ inputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up aube and Node
        uses: jdx/aube-action@v1
        with:
          node-version: "22"

      - name: Resolve resume source
        run: |
          git clone --depth 1 https://github.com/rwendell/json-resume.git /tmp/json-resume
          SOURCE_SHA=$(git -C /tmp/json-resume rev-parse HEAD:src/resume.json)
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          if [ "$FORCE_REBUILD" != "true" ] && [ -f .resume-source ] && [ "$(cat .resume-source)" = "$SOURCE_SHA" ]; then
            echo "Resume source is unchanged; skipping build."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Build resume
        if: env.SKIP_BUILD != 'true'
        run: |
          cd /tmp/json-resume
          aube ci
          aube exec --no-install -- puppeteer browsers install chrome
          aube run pdf -- resume
          aube run render -- resume

          cp dist/resume/resume.pdf "$GITHUB_WORKSPACE/static/resume/resume.pdf"
          cp "$GITHUB_WORKSPACE/scripts/render-resume-previews.mjs" render-resume-previews.mjs
          node render-resume-previews.mjs \
            "$PWD/dist/resume/resume.html" \
            "$GITHUB_WORKSPACE/src/routes/layout.css" \
            "$GITHUB_WORKSPACE/static/resume/resume-preview-latte.png" \
            "$GITHUB_WORKSPACE/static/resume/resume-preview-macchiato.png"

          printf '%s\n' "$SOURCE_SHA" > "$GITHUB_WORKSPACE/.resume-source"

      - name: Commit resume update
        if: env.SKIP_BUILD != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            static/resume/resume.pdf \
            static/resume/resume-preview-latte.png \
            static/resume/resume-preview-macchiato.png \
            .resume-source

          if git diff --cached --quiet; then
            echo "Resume assets are unchanged."
            exit 0
          fi

          git commit -m "Update hosted resume from json-resume@${SOURCE_SHA}"
          git pull --rebase origin main
          git push
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Deploy updated site
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
