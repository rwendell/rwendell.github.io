name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up aube and Node
        uses: jdx/aube-action@v1
        with:
          node-version: "22"
          run-install: true

      - name: Check
        run: aube run check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: aube run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
